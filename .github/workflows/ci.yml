name: CI Pipeline

on:
  pull_request:
    branches: ["main"]

  push:
    branches: ["main"]

jobs:
    build_test:
        runs-on: ubuntu-latest

      - name: Install uv
        run: |
          curl -Ls https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync

            # UV install
            - name: Install uv
              run: |
                curl -Ls https://astral.sh/uv/install.sh | sh
                echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            

      - name: Ruff format check
        run: |
          uv run ruff format . --check

            # Run tests
            - name: Run tests
              run: |
                echo "PWD=$(pwd)"
                export PYTHONPATH=$(pwd)
                python -c "import sys; print(sys.path)"
                uv run pytest -q
            # Docker setup
            - name: Set up Docker
              uses: docker/setup-buildx-action@v3


            # Docker build(no push)
            - name: Build Docker Image
              run: docker build -f Dockerfile.uvicorn -t mle-uvicorn:ci .

            - name: Build Streamlit Image
              run: docker build -f Dockerfile.streamlit -t mle-streamlit:ci .



      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2


      - name: Tag & Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker tag mle-uvicorn:latest \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_UVICORN_REPO}}:latest
          docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_UVICORN_REPO}}:latest

      - name: Tag & Push Streamlit image
        if: github.event_name == 'push'
        run: |
          docker tag mle-streamlit:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_STREAMLIT_REPO }}:latest
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_STREAMLIT_REPO }}:latest